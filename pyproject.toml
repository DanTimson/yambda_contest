[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yambda-contest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "polars>=1.30,<2", "pyarrow>=17", "scipy>=1.13", "scikit-learn>=1.5", "catboost>=1.2.8,<2", "huggingface-hub>=0.30", "threadpoolctl>=3"]

[project.optional-dependencies]
als = ["implicit>=0.7.2,<0.8"]
test = ["pytest>=8"]

[project.scripts]
yambda = "yambda_contest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
